name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Generate Android app assets
        run: |
          npx @capacitor/assets@3.0.5 generate \
            --android \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#ffffff' \
            --splashBackgroundColor '#ffffff' \
            --splashBackgroundColorDark '#ffffff'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore

      - name: Configure release signing
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          header = '''def releaseSigning = new Properties()
          def releaseSigningFile = rootProject.file("keystore.properties")
          if (releaseSigningFile.exists()) {
              releaseSigning.load(new FileInputStream(releaseSigningFile))
          }

          '''

          signing = '''    signingConfigs {
                  release {
                      if (releaseSigningFile.exists()) {
                          storeFile rootProject.file(releaseSigning['storeFile'])
                          storePassword releaseSigning['storePassword']
                          keyAlias releaseSigning['keyAlias']
                          keyPassword releaseSigning['keyPassword']
                      }
                  }
              }

          '''

          if "def releaseSigning = new Properties()" not in s:
              s = header + s

          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {\n" + signing, 1)

          if "signingConfig signingConfigs.release" not in s:
              s = s.replace(
                  "release {\n        minifyEnabled false",
                  "release {\n        signingConfig signingConfigs.release\n        minifyEnabled false",
                  1
              )

          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify release APK
        run: test -n "$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: Solut_Arquive-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      - name: Remove signing material
        if: always()
        run: rm -f android/release.keystore android/keystore.properties
