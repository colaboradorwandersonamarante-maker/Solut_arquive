name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android assets
        run: npx @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore

      - name: Configure release signing
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          block = "\n".join([
              'def releaseSigning = new Properties()',
              'def releaseSigningFile = rootProject.file("keystore.properties")',
              'if (releaseSigningFile.exists()) {',
              '    releaseSigning.load(new FileInputStream(releaseSigningFile))',
              '}',
              ''
          ])
          if "def releaseSigning = new Properties()" not in s:
              s = block + s
          signing = "\n".join([
              'signingConfigs {',
              '    release {',
              "        if (releaseSigningFile.exists()) {",
              "            storeFile rootProject.file(releaseSigning['storeFile'])",
              "            storePassword releaseSigning['storePassword']",
              "            keyAlias releaseSigning['keyAlias']",
              "            keyPassword releaseSigning['keyPassword']",
              "        }",
              "    }",
              "}",
              ""
          ])
          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {\n" + signing, 1)
          s = s.replace(
              "release {\n        minifyEnabled false",
              "release {\n        signingConfig signingConfigs.release\n        minifyEnabled false",
              1
          )
          p.write_text(s)
          PY

      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove signing material
        if: always()
        run: rm -f android/release.keystore android/keystore.properties

      - name: Upload APK to workflow
        uses: actions/upload-artifact@v5
        with:
          name: Solut_Arquive-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
