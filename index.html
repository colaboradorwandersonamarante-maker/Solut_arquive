<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solut_Arquive</title>
<link rel="icon" type="image/png" href="./assets/icon.png">
<style>
  :root {
    box-sizing: border-box;
    --paper: #EFEAE0; --paper-2: #F7F4EC; --surface: #FFFDF8;
    --ink: #20251F; --ink-soft: #5B6157; --ink-faint: #8B9084;
    --line: #D9D3C2; --line-strong: #C3BCA6;
    --accent: #0F6B5C; --accent-2: #12876F; --accent-soft: #E3ECE7;
    --amber: #C9862B; --amber-soft: #F3E6CE;
    --danger: #AD4530; --danger-soft: #F3E0DA;
    --highlight: #FDE68A;
    --radius-s: 3px; --radius-m: 6px;
    --shadow-page: 0 1px 2px rgba(32,37,31,0.06), 0 8px 24px rgba(32,37,31,0.08);
    --font-display: Georgia, 'Times New Roman', serif; --font-ui: Arial, Helvetica, sans-serif; --font-mono: 'Courier New', monospace;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14170F; --paper-2: #191D14; --surface: #1D2117;
      --ink: #EAE7DA; --ink-soft: #B3B0A0; --ink-faint: #757A6B;
      --line: #333A28; --line-strong: #454C36;
      --accent: #35A78C; --accent-2: #43C29E; --accent-soft: #1E2E27;
      --amber: #D9A24E; --amber-soft: #332A17; --danger: #D8735A; --danger-soft: #33201A;
      --shadow-page: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --paper: #14170F; --paper-2: #191D14; --surface: #1D2117;
    --ink: #EAE7DA; --ink-soft: #B3B0A0; --ink-faint: #757A6B;
    --line: #333A28; --line-strong: #454C36;
    --accent: #35A78C; --accent-2: #43C29E; --accent-soft: #1E2E27;
    --amber: #D9A24E; --amber-soft: #332A17; --danger: #D8735A; --danger-soft: #33201A;
    --shadow-page: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px rgba(0,0,0,0.4);
  }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-ui); background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent-soft); color: var(--accent); }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Splash */
  #splash { position: fixed; inset: 0; background: var(--paper); z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity .35s ease; }
  #splash.hidden { opacity: 0; pointer-events: none; }
  .splash-lockup { display: flex; align-items: center; }
  .splash-icon { width: 30px; height: 30px; object-fit: contain; opacity: 0; transform: scale(.6); animation: splashIconIn .45s ease forwards; }
  .splash-word { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--ink); margin-left: 10px; opacity: 0; transform: translateX(-18px); clip-path: inset(0 100% 0 0); animation: splashWordIn .55s .4s cubic-bezier(.2,.7,.3,1) forwards; white-space: nowrap; }
  #splash .ld { font-size: 12.5px; color: var(--ink-faint); opacity: 0; animation: splashFade .4s .85s ease forwards; }
  @keyframes splashIconIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes splashWordIn { from { opacity: 0; transform: translateX(-18px); clip-path: inset(0 100% 0 0); } to { opacity: 1; transform: translateX(0); clip-path: inset(0 0 0 0); } }
  @keyframes splashFade { from { opacity: 0; } to { opacity: 1; } }

  #app { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { padding: env(safe-area-inset-top, 0px) 22px 0 22px; background: var(--paper-2); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 20px; height: calc(56px + env(safe-area-inset-top, 0px)); flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .brand img { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }
  .brand .mark { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: 0.2px; }
  .omnibox { flex: 1; max-width: 460px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 7px 12px; color: var(--ink-faint); font-size: 13.5px; }
  .omnibox svg { flex-shrink: 0; opacity: 0.6; }
  .omnibox input { border: none; background: none; outline: none; width: 100%; font-size: 13.5px; color: var(--ink); }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 50%; color: var(--ink-soft); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .icon-btn.filled { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .icon-btn.filled:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .icon-btn.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .icon-btn.sm { width: 26px; height: 26px; }
  .icon-btn:disabled { opacity: .4; pointer-events: none; }

  .tabs { display: flex; align-items: flex-end; gap: 2px; padding: 10px 18px 0 18px; background: var(--paper-2); overflow-x: auto; flex-shrink: 0; }
  .tab { border: 1px solid var(--line); border-bottom: none; background: var(--paper); color: var(--ink-faint); padding: 9px 18px 10px; font-size: 13px; font-weight: 500; border-radius: 7px 7px 0 0; position: relative; top: 1px; white-space: nowrap; display: flex; align-items: center; gap: 7px; transition: color .12s ease; }
  .tab svg { opacity: .55; }
  .tab:hover { color: var(--ink); }
  .tab.active { background: var(--surface); color: var(--ink); border-color: var(--line); box-shadow: 0 -1px 0 var(--surface) inset; }
  .tab.active svg { opacity: 1; color: var(--accent); }
  .tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--surface); }

  main.canvas { flex: 1; background: var(--surface); border-top: 1px solid var(--line); display: flex; overflow: hidden; min-height: 0; }
  .module { display: none; width: 100%; height: 100%; overflow: hidden; }
  .module.active { display: flex; }

  .empty { margin: auto; text-align: center; color: var(--ink-faint); max-width: 320px; padding: 20px; }
  .empty .icon { font-family: var(--font-display); font-size: 32px; color: var(--line-strong); margin-bottom: 6px; }
  .empty h3 { font-family: var(--font-display); font-size: 17px; color: var(--ink-soft); margin: 4px 0 6px; font-weight: 600; }
  .empty p { font-size: 13px; line-height: 1.5; margin: 0 0 14px; }

  .side-btn { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: var(--radius-m); color: var(--ink-soft); font-size: 13.5px; border: 1px solid transparent; background: none; width: 100%; text-align: left; }
  .side-btn:hover { background: var(--paper-2); color: var(--ink); }
  .side-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .side-btn .del { margin-left: auto; opacity: 0; color: var(--danger); font-size: 12px; padding: 2px 4px; display: flex; }
  .side-btn:hover .del { opacity: .7; }
  .side-btn .del:hover { opacity: 1; }
  .side-btn .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .rail { width: 230px; flex-shrink: 0; border-right: 1px solid var(--line); background: var(--paper-2); display: flex; flex-direction: column; padding: 14px; gap: 4px; overflow-y: auto; }
  .rail-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .rail-title { font-size: 11px; letter-spacing: .2px; color: var(--ink-faint); font-weight: 600; }

  /* Docs */
  #mod-docs .doc-body { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .doc-toolbar { display: flex; align-items: center; gap: 2px; padding: 8px 20px; border-bottom: 1px solid var(--line); background: var(--paper-2); flex-wrap: wrap; }
  .tb-btn { width: 30px; height: 30px; border-radius: var(--radius-s); border: 1px solid transparent; background: none; color: var(--ink-soft); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .tb-btn:hover { background: var(--surface); border-color: var(--line); color: var(--ink); }
  .tb-sep { width: 1px; height: 20px; background: var(--line); margin: 0 8px; flex-shrink: 0; }
  .tb-select { height: 30px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface); color: var(--ink-soft); font-size: 12px; padding: 0 6px; max-width: 92px; }
  .tb-select:hover { border-color: var(--line-strong); color: var(--ink); }
  .doc-scroll { flex: 1; overflow-y: auto; padding: 44px 24px; }
  .doc-page { max-width: 680px; margin: 0 auto; background: var(--surface); box-shadow: var(--shadow-page); padding: 64px 72px; min-height: 900px; border-radius: 2px; }
  .doc-title-input { border: none; outline: none; background: none; width: 100%; font-family: var(--font-display); font-size: 30px; font-weight: 600; color: var(--ink); margin-bottom: 18px; }
  .doc-title-input::placeholder { color: var(--line-strong); }
  .doc-editable { outline: none; font-size: 15.5px; line-height: 1.75; color: var(--ink); min-height: 600px; }
  .doc-editable:empty:before { content: attr(data-placeholder); color: var(--ink-faint); }
  .doc-meta { font-size: 12px; color: var(--ink-faint); padding: 10px 20px; border-top: 1px solid var(--line); background: var(--paper-2); display: flex; align-items: center; gap: 6px; }

  /* Sheets */
  #mod-sheets { flex-direction: column; }
  .sheet-bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--paper-2); flex-wrap: wrap; }
  .cell-badge { font-family: var(--font-mono); font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 5px 9px; min-width: 40px; text-align: center; color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .formula-input { flex: 1; min-width: 120px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface); padding: 6px 10px; font-family: var(--font-mono); font-size: 13px; outline: none; }
  .formula-input:focus { border-color: var(--accent); }
  .color-swatch { width: 26px; height: 26px; border: 1px solid var(--line); border-radius: var(--radius-s); padding: 2px; background: var(--surface); cursor: pointer; flex-shrink: 0; }
  .sheet-scroll { flex: 1; overflow: auto; }
  table.grid { border-collapse: collapse; }
  table.grid th { position: sticky; top: 0; background: var(--paper-2); border: 1px solid var(--line); font-size: 11.5px; color: var(--ink-faint); font-weight: 500; min-width: 96px; height: 26px; z-index: 2; }
  table.grid th:first-child { left: 0; z-index: 3; min-width: 40px; }
  table.grid td.rowhead { position: sticky; left: 0; background: var(--paper-2); border: 1px solid var(--line); text-align: center; font-size: 11.5px; color: var(--ink-faint); width: 40px; }
  table.grid td.cell { border: 1px solid var(--line); padding: 0; }
  table.grid td.cell input { width: 100%; height: 26px; border: none; outline: none; background: var(--surface); padding: 0 8px; font-size: 13px; color: var(--ink); }
  table.grid td.cell input:focus { outline: 2px solid var(--accent); outline-offset: -2px; position: relative; z-index: 1; }
  .sheet-tabs { display: flex; align-items: center; gap: 4px; padding: 6px 16px; border-top: 1px solid var(--line); background: var(--paper-2); }
  .sheet-tab { padding: 6px 14px; font-size: 12.5px; border-radius: var(--radius-s); color: var(--ink-faint); border: 1px solid transparent; }
  .sheet-tab.active { background: var(--surface); border-color: var(--line); color: var(--accent); font-weight: 500; }

  /* Slides */
  #mod-slides .slide-strip { width: 190px; flex-shrink: 0; border-right: 1px solid var(--line); background: var(--paper-2); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .thumb { aspect-ratio: 16/10; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius-s); padding: 10px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
  .thumb.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .thumb .num { position: absolute; top: -8px; left: -8px; background: var(--paper-2); color: var(--ink-faint); font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); z-index: 1; }
  .thumb .tt { font-family: var(--font-display); font-size: 8.5px; font-weight: 700; color: var(--ink); line-height: 1.2; overflow: hidden; }
  .thumb .tb { font-size: 6px; color: var(--ink-faint); line-height: 1.3; overflow: hidden; }
  .thumb .bar { width: 16px; height: 2.5px; background: var(--accent); border-radius: 2px; }
  .thumb .thumb-img { position: absolute; right: 6px; bottom: 6px; width: 22px; height: 16px; object-fit: cover; border-radius: 2px; border: 1px solid var(--line); }
  .slide-stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .slide-canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; overflow: auto; }
  .slide-canvas { width: 100%; max-width: 760px; aspect-ratio: 16/9; background: var(--surface); box-shadow: var(--shadow-page); padding: 52px 60px; display: flex; gap: 24px; border-radius: 2px; }
  .slide-canvas-text { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; min-width: 0; }
  .slide-canvas .accent-bar { width: 46px; height: 5px; background: var(--accent); border-radius: 3px; }
  .slide-title-edit { font-family: var(--font-display); font-size: 34px; font-weight: 600; border: none; outline: none; background: none; color: var(--ink); width: 100%; }
  .slide-body-edit { font-size: 15px; line-height: 1.6; border: none; outline: none; background: none; resize: none; color: var(--ink-soft); width: 100%; font-family: inherit; min-height: 120px; flex: 1; }
  .slide-image-wrap { flex: 0 0 38%; display: flex; align-items: center; justify-content: center; position: relative; }
  .slide-image-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: var(--radius-s); }
  .slide-image-remove { position: absolute; top: -8px; right: -8px; }
  .slide-controls { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--paper-2); flex-wrap: wrap; }

  /* Presentation mode */
  .present-overlay { position: fixed; inset: 0; z-index: 500; background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
  .present-overlay[hidden] { display: none; }
  .present-slide { width: 100%; max-width: 920px; aspect-ratio: 16/9; background: var(--surface); border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,.4); padding: 6% 8%; display: flex; gap: 30px; }
  .present-slide-text { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; min-width: 0; }
  .present-slide h1 { font-family: var(--font-display); font-size: clamp(22px, 3.6vw, 40px); margin: 0; color: var(--ink); }
  .present-slide p { font-size: clamp(13px, 1.5vw, 19px); line-height: 1.6; color: var(--ink-soft); white-space: pre-wrap; margin: 0; }
  .present-slide-image { flex: 0 0 36%; display: flex; align-items: center; justify-content: center; }
  .present-slide-image img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
  .present-controls { display: flex; align-items: center; gap: 14px; margin-top: 22px; }
  .present-controls .icon-btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); color: var(--paper); }
  .present-controls .icon-btn:hover { border-color: var(--accent-2); color: var(--accent-2); }
  .present-counter { color: var(--paper); font-size: 13px; font-family: var(--font-mono); min-width: 54px; text-align: center; }

  /* Calendar */
  #mod-calendar { flex-direction: column; }
  .cal-head { display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
  .cal-head .month { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
  .reminder-banner { display: flex; align-items: center; gap: 10px; background: var(--amber-soft); color: var(--amber); padding: 10px 22px; font-size: 13px; border-bottom: 1px solid var(--line); }
  .reminder-banner span { flex: 1; }
  .cal-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(100px, 1fr); overflow-y: auto; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--ink-faint); padding: 8px 0; border-bottom: 1px solid var(--line); background: var(--paper-2); font-weight: 600; }
  .cal-day { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 7px 8px; position: relative; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
  .cal-day:hover { background: var(--paper-2); }
  .cal-day.muted { color: var(--ink-faint); background: var(--paper); }
  .cal-day.today .dnum { background: var(--accent); color: #fff; }
  .dnum { font-size: 12px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .cal-evt { font-size: 10.5px; padding: 2px 6px; border-radius: 3px; background: var(--amber-soft); color: var(--amber); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 2px solid var(--amber); }
  .cal-popover { position: fixed; z-index: 50; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); box-shadow: var(--shadow-page); padding: 14px; width: 260px; display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow-y: auto; }
  .cal-popover input[type=text], .cal-popover textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--radius-s); padding: 7px 9px; font-size: 13px; outline: none; background: var(--paper); resize: none; font-family: inherit; }
  .cal-popover-title { font-size: 12px; color: var(--ink-faint); }
  .remind-row { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-soft); }
  .cal-popover .row { display: flex; justify-content: flex-end; }
  .cal-existing { display: flex; flex-direction: column; gap: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .cal-existing-item { display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; background: var(--paper-2); border-radius: var(--radius-s); padding: 6px 8px; }
  .cal-existing-item .txt { flex: 1; min-width: 0; }
  .cal-existing-item .txt .t { font-weight: 500; color: var(--ink); }
  .cal-existing-item .txt .n { color: var(--ink-faint); font-size: 11.5px; }
  .cal-existing-item button { flex-shrink: 0; color: var(--danger); background: none; border: none; padding: 2px; }

  /* Files */
  #mod-files { flex-direction: column; }
  .files-head { display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
  .files-head h2 { font-family: var(--font-display); font-size: 19px; margin: 0; font-weight: 600; }
  .files-list { flex: 1; overflow-y: auto; padding: 6px 22px; }
  .file-row { display: flex; align-items: center; gap: 12px; padding: 11px 6px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .file-row .ficon { width: 30px; height: 30px; border-radius: var(--radius-s); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; font-weight: 700; font-family: var(--font-mono); overflow: hidden; }
  .file-row .ficon img { width: 100%; height: 100%; object-fit: cover; }
  .file-row .fname { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row .fmeta { color: var(--ink-faint); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }

  /* Image editor overlay */
  .editor-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(20,23,15,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; gap: 18px; }
  .editor-overlay[hidden] { display: none; }
  .editor-canvas-wrap { max-width: 90vw; max-height: 60vh; display: flex; align-items: center; justify-content: center; }
  .editor-canvas-wrap img { max-width: 90vw; max-height: 60vh; object-fit: contain; border-radius: 4px; box-shadow: 0 20px 50px rgba(0,0,0,.4); background: var(--surface); }
  .editor-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .editor-controls .icon-btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); color: var(--paper); }
  .editor-controls .icon-btn:hover { border-color: var(--accent-2); color: var(--accent-2); }
  .editor-controls .icon-btn.on { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }

  @media (max-width: 760px) {
    .omnibox { max-width: 150px; }
    .rail, #mod-slides .slide-strip { width: 74px; }
    .rail .side-btn span.label { display: none; }
    .doc-page { padding: 34px 22px; }
    .slide-canvas { padding: 28px; flex-direction: column; }

<script>(function () {
  "use strict";

  /* ============================================================
     Utilities
  ============================================================ */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const uid = () => Math.random().toString(36).slice(2, 10);

  const LS = {
    get(key, fallback) {
      try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
      catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
      scheduleBackendSave();
    }
  };

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function slug(s) {
    return (s || 'arquivo').trim().toLowerCase().replace(/[^\w\-]+/g, '_').replace(/_+/g, '_').slice(0, 60) || 'arquivo';
  }

  const scriptCache = {};
  function loadScript(src) {
    if (scriptCache[src]) return scriptCache[src];
    scriptCache[src] = new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = src;
      el.onload = () => resolve(true);
      el.onerror = () => { delete scriptCache[src]; reject(new Error('load_fail')); };
      document.head.appendChild(el);
    });
    return scriptCache[src];
  }

  /* ============================================================
     Local app storage
     ============================================================ */
  // The original hosted artifact backend is not used in this standalone build.
  // This APK/PWA build is self-contained and uses localStorage instead.
  let saveHandle = null;

  function scheduleBackendSave() {
    // Intentionally local-only: LS.set() persists data immediately.
  }

  async function initBackend() {
    // Kept as an async compatibility hook for the original boot sequence.
    return true;
  }

  function ymNow() {
    const now = new Date();
    return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  }

  async function incrementUsage() {
    const ym = ymNow();
    const local = LS.get('sa:usage', {});
    local[ym] = (local[ym] || 0) + 1;
    try { localStorage.setItem('sa:usage', JSON.stringify(local)); } catch (e) {}
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = String(reader.result || '');
        const comma = result.indexOf(',');
        resolve(comma >= 0 ? result.slice(comma + 1) : result);
      };
      reader.onerror = () => reject(reader.error || new Error('file_read_failed'));
      reader.readAsDataURL(blob);
    });
  }

  async function exportFile(filename, data) {
    try {
      const blob = data instanceof Blob
        ? data
        : new Blob([data], { type: 'application/octet-stream' });

      // Native Android path: Filesystem plugin bridge writes to Documents.
      if (typeof window.nativeSaveFile === 'function') {
        await window.nativeSaveFile(filename, await blobToBase64(blob));
        return;
      }

      // Browser/GitHub Pages fallback.
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    } catch (e) {
      alert('Não foi possível salvar o arquivo agora. Tente novamente.');
    }
  }

  /* ============================================================
     DOCX generation (self-contained OOXML writer, no external
     document-generation library — only JSZip for the container)
  ============================================================ */
  const DOCX_SIZE_HALFPT = { '1': 16, '2': 20, '3': 24, '4': 28, '5': 36, '6': 48, '7': 64 };

  function docxEscape(s) {
    return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }

  function htmlToDocxParagraphs(html) {
    const container = document.createElement('div');
    container.innerHTML = html || '';
    const paragraphs = [];

    function styleFromNode(el, inherited) {
      const st = Object.assign({}, inherited);
      const tag = el.tagName;
      if (tag === 'B' || tag === 'STRONG') st.bold = true;
      if (tag === 'I' || tag === 'EM') st.italic = true;
      if (tag === 'U') st.underline = true;
      if (tag === 'FONT') {
        if (el.getAttribute('size')) st.legacySize = el.getAttribute('size');
        if (el.getAttribute('face')) st.fontFamily = el.getAttribute('face').split(',')[0].trim();
      }
      const inlineStyle = el.getAttribute && el.getAttribute('style');
      if (inlineStyle) {
        const fam = /font-family:\s*([^;]+)/i.exec(inlineStyle);
        if (fam) st.fontFamily = fam[1].replace(/['"]/g, '').split(',')[0].trim();
        const sizePx = /font-size:\s*([\d.]+)px/i.exec(inlineStyle);
        if (sizePx) st.halfPt = Math.round(parseFloat(sizePx[1]) * 0.75 * 2);
        const bg = /background-color:\s*([^;]+)/i.exec(inlineStyle);
        if (bg && !/transparent|rgba\(0,\s*0,\s*0,\s*0\)/i.test(bg[1])) st.highlight = true;
      }
      return st;
    }

    function walkInline(node, inherited, out) {
      if (node.nodeType === 3) {
        if (node.textContent) out.push(Object.assign({ text: node.textContent }, inherited));
        return;
      }
      if (node.nodeType !== 1) return;
      if (node.tagName === 'BR') { out.push(Object.assign({ text: '\n' }, inherited)); return; }
      const st = styleFromNode(node, inherited);
      Array.from(node.childNodes).forEach(child => walkInline(child, st, out));
    }

    function alignOf(el) {
      const style = (el.getAttribute && el.getAttribute('style')) || '';
      const m = /text-align:\s*(left|center|right|justify)/i.exec(style);
      if (m) return m[1];
      if (el.getAttribute && el.getAttribute('align')) return el.getAttribute('align');
      return 'left';
    }

    function processBlock(el, listCtx) {
      const tag = el.tagName;
      if (tag === 'UL' || tag === 'OL') {
        Array.from(el.children).forEach((li, i) => processBlock(li, { bullet: tag === 'UL', index: i + 1 }));
        return;
      }
      const runs = [];
      Array.from(el.childNodes).forEach(child => walkInline(child, {}, runs));
      if (!runs.length && tag !== 'LI') return;
      paragraphs.push({
        runs,
        align: alignOf(el),
        heading: tag === 'H1' || tag === 'H2' || tag === 'H3',
        list: listCtx || null
      });
    }

    Array.from(container.children).forEach(el => processBlock(el, null));
    if (!paragraphs.length) {
      const text = container.textContent.trim();
      if (text) paragraphs.push({ runs: [{ text }], align: 'left', heading: false, list: null });
    }
    return paragraphs;
  }

  function docxRunXml(run) {
    const props = [];
    if (run.bold) props.push('<w:b/>');
    if (run.italic) props.push('<w:i/>');
    if (run.underline) props.push('<w:u w:val="single"/>');
    if (run.fontFamily) props.push('<w:rFonts w:ascii="' + docxEscape(run.fontFamily) + '" w:hAnsi="' + docxEscape(run.fontFamily) + '"/>');
    const half = run.halfPt || (run.legacySize && DOCX_SIZE_HALFPT[run.legacySize]);
    if (half) props.push('<w:sz w:val="' + half + '"/><w:szCs w:val="' + half + '"/>');
    if (run.highlight) props.push('<w:highlight w:val="yellow"/>');
    const rPr = props.length ? '<w:rPr>' + props.join('') + '</w:rPr>' : '';
    return '<w:r>' + rPr + '<w:t xml:space="preserve">' + docxEscape(run.text) + '</w:t></w:r>';
  }

  function docxParagraphXml(p) {
    const pPrParts = [];
    if (p.align && p.align !== 'left') pPrParts.push('<w:jc w:val="' + (p.align === 'justify' ? 'both' : p.align) + '"/>');
    if (p.list) pPrParts.push('<w:ind w:left="720"/>');
    const pPr = pPrParts.length ? '<w:pPr>' + pPrParts.join('') + '</w:pPr>' : '';

    let runs = p.runs;
    if (p.heading) runs = runs.map(r => Object.assign({}, r, { bold: true, legacySize: r.legacySize || '5' }));

    let runsXml = runs.map(docxRunXml).join('');
    if (p.list) {
      const prefix = p.list.bullet ? '\u2022 ' : (p.list.index + '. ');
      runsXml = '<w:r><w:t xml:space="preserve">' + prefix + '</w:t></w:r>' + runsXml;
    }
    if (!runsXml) runsXml = '<w:r><w:t></w:t></w:r>';
    return '<w:p>' + pPr + runsXml + '</w:p>';
  }

  async function buildDocxBlob(title, bodyHtml) {
    await loadScript('./vendor/jszip.min.js');

    const paragraphs = [{ runs: [{ text: title || 'Documento sem título' }], align: 'left', heading: true, list: null }]
      .concat(htmlToDocxParagraphs(bodyHtml));

    const bodyXml = paragraphs.map(docxParagraphXml).join('')
      + '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr>';

    const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + bodyXml + '</w:body></w:document>';

    const contentTypesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
      + '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>'
      + '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>'
      + '</Types>';

    const relsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
      + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>'
      + '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>'
      + '</Relationships>';

    const now = new Date().toISOString();
    const coreXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">'
      + '<dc:title>' + docxEscape(title || 'Documento') + '</dc:title>'
      + '<dc:creator>Solut_Arquive</dc:creator><cp:lastModifiedBy>Solut_Arquive</cp:lastModifiedBy>'
      + '<dcterms:created xsi:type="dcterms:W3CDTF">' + now + '</dcterms:created>'
      + '<dcterms:modified xsi:type="dcterms:W3CDTF">' + now + '</dcterms:modified>'
      + '</cp:coreProperties>';

    const appXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>Solut_Arquive</Application></Properties>';

    const zip = new window.JSZip();
    zip.file('[Content_Types].xml', contentTypesXml);
    zip.file('_rels/.rels', relsXml);
    zip.file('word/document.xml', documentXml);
    zip.file('docProps/core.xml', coreXml);
    zip.file('docProps/app.xml', appXml);
    return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  }

  /* ============================================================
     Image helpers (import + lightweight in-browser editing)
  ============================================================ */
  function readImageDownscaled(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            const scale = maxDim / Math.max(w, h);
            w = Math.round(w * scale); h = Math.round(h * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => reject(new Error('image_decode_failed'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('file_read_failed'));
      reader.readAsDataURL(file);
    });
  }

  function transformImage(dataUrl, opts) {
    const rotate = opts.rotate || 0, flipH = !!opts.flipH, grayscale = !!opts.grayscale;
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const swap = rotate % 180 !== 0;
        const w = swap ? img.height : img.width;
        const h = swap ? img.width : img.height;
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.translate(w / 2, h / 2);
        ctx.rotate(rotate * Math.PI / 180);
        ctx.scale(flipH ? -1 : 1, 1);
        ctx.drawImage(img, -img.width / 2, -img.height / 2);
        if (grayscale) {
          const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const d = frame.data;
          for (let i = 0; i < d.length; i += 4) {
            const v = d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11;
            d[i] = d[i + 1] = d[i + 2] = v;
          }
          ctx.putImageData(frame, 0, 0);
        }
        resolve(canvas.toDataURL('image/jpeg', 0.9));
      };
      img.src = dataUrl;
    });
  }

     Planilhas
  ============================================================ */
  function initSheets() {
    const COLS = 10, ROWS = 24;
    const colLetter = i => String.fromCharCode(65 + i);

    let sheets = LS.get('sa:sheets', null);
    if (!sheets) sheets = { active: 'Planilha 1', order: ['Planilha 1'], data: { 'Planilha 1': {} }, styles: {} };
    if (!sheets.styles) sheets.styles = {};
    let selected = 'A1';

    function save() { LS.set('sa:sheets', sheets); }
    function currentData() { return sheets.data[sheets.active]; }
    function currentStyles() { sheets.styles[sheets.active] = sheets.styles[sheets.active] || {}; return sheets.styles[sheets.active]; }

    function expandRange(a, b) {
      const parse = c => ({ col: c.match(/[A-Z]+/)[0], row: parseInt(c.match(/\d+/)[0], 10) });
      const pa = parse(a), pb = parse(b);
      const c1 = pa.col.charCodeAt(0), c2 = pb.col.charCodeAt(0);
      const cells = [];
      for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++)
        for (let r = Math.min(pa.row, pb.row); r <= Math.max(pa.row, pb.row); r++) cells.push(String.fromCharCode(c) + r);
      return cells;
    }

    function evalCell(id, visiting) {
      visiting = visiting || new Set();
      const raw = currentData()[id];
      if (raw === undefined || raw === '') return '';
      if (visiting.has(id)) return '#CIRC';
      if (typeof raw !== 'string' || !raw.startsWith('=')) return raw;

      visiting.add(id);
      let expr = raw.slice(1).toUpperCase();
      expr = expr.replace(/(SOMA|SUM)\(([A-Z]+\d+):([A-Z]+\d+)\)/g, (m, fn, a, b) => {
        const vals = expandRange(a, b).map(c => Number(evalCell(c, visiting)) || 0);
        return String(vals.reduce((s, v) => s + v, 0));
      });
      expr = expr.replace(/(MEDIA|AVERAGE)\(([A-Z]+\d+):([A-Z]+\d+)\)/g, (m, fn, a, b) => {
        const vals = expandRange(a, b).map(c => Number(evalCell(c, visiting)) || 0);
        return String(vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : 0);
      });
      expr = expr.replace(/[A-Z]+\d+/g, ref => {
        const n = Number(evalCell(ref, visiting));
        return isNaN(n) ? '0' : String(n);
      });
      try {
        const result = Function('"use strict"; return (' + expr + ')')();
        visiting.delete(id);
        return (typeof result === 'number' && !isNaN(result)) ? Math.round(result * 10000) / 10000 : '#ERRO';
      } catch (e) { visiting.delete(id); return '#ERRO'; }
    }

    function renderTable() {
      const table = $('#sheetTable');
      table.innerHTML = '';
      const head = document.createElement('tr');
      head.appendChild(document.createElement('th'));
      for (let c = 0; c < COLS; c++) { const th = document.createElement('th'); th.textContent = colLetter(c); head.appendChild(th); }
      table.appendChild(head);

      const styles = currentStyles();
      for (let r = 1; r <= ROWS; r++) {
        const tr = document.createElement('tr');
        const rowHead = document.createElement('td'); rowHead.className = 'rowhead'; rowHead.textContent = r; tr.appendChild(rowHead);
        for (let c = 0; c < COLS; c++) {
          const id = colLetter(c) + r;
          const cell = document.createElement('td'); cell.className = 'cell';
          const input = document.createElement('input');
          input.value = evalCell(id);
          input.dataset.id = id;
          const st = styles[id];
          if (st) {
            if (st.bold) input.style.fontWeight = '700';
            if (st.color) input.style.color = st.color;
            if (st.bg) input.style.background = st.bg;
          }
          input.addEventListener('focus', () => selectCell(id));
          input.addEventListener('input', () => {
            const val = input.value;
            currentData()[id] = val === '' ? undefined : (val.startsWith('=') || isNaN(Number(val)) ? val : Number(val));
            save();
          });
          input.addEventListener('blur', () => { input.value = evalCell(id); });
          cell.appendChild(input);
          tr.appendChild(cell);
        }
        table.appendChild(tr);
      }
    }

    function selectCell(id) {
      selected = id;
      $('#cellBadge').textContent = id;
      const raw = currentData()[id];
      $('#formulaInput').value = raw === undefined ? '' : String(raw);
      const st = currentStyles()[id] || {};
      $('#sheetBoldBtn').classList.toggle('on', !!st.bold);
      $('#sheetTextColor').value = st.color || '#20251f';
      $('#sheetFillColor').value = st.bg || '#ffffff';
    }

    $('#formulaInput').addEventListener('input', e => { currentData()[selected] = e.target.value === '' ? undefined : e.target.value; save(); });
    $('#formulaInput').addEventListener('keydown', e => { if (e.key === 'Enter') { renderTable(); selectCell(selected); } });

    $('#sheetBoldBtn').addEventListener('click', () => {
      const styles = currentStyles(); const cur = styles[selected] || {};
      cur.bold = !cur.bold; styles[selected] = cur; save(); renderTable(); selectCell(selected);
    });
    $('#sheetTextColor').addEventListener('input', e => {
      const styles = currentStyles(); const cur = styles[selected] || {};
      cur.color = e.target.value; styles[selected] = cur; save(); renderTable(); selectCell(selected);
    });
    $('#sheetFillColor').addEventListener('input', e => {
      const styles = currentStyles(); const cur = styles[selected] || {};
      cur.bg = e.target.value; styles[selected] = cur; save(); renderTable(); selectCell(selected);
    });

    function renderSheetTabs() {
      const bar = $('#sheetTabs');
      bar.innerHTML = '';
      sheets.order.forEach(name => {
        const tab = document.createElement('button');
        tab.className = 'sheet-tab' + (name === sheets.active ? ' active' : '');
        tab.textContent = name;
        tab.addEventListener('click', () => { sheets.active = name; save(); renderSheetTabs(); renderTable(); });
        bar.appendChild(tab);
      });
      const add = document.createElement('button');
      add.className = 'icon-btn sm'; add.title = 'Nova planilha'; add.setAttribute('aria-label', 'Nova planilha'); add.style.marginLeft = '4px';
      add.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>';
      add.addEventListener('click', () => {
        const name = 'Planilha ' + (sheets.order.length + 1);
        sheets.order.push(name); sheets.data[name] = {}; sheets.styles[name] = {}; sheets.active = name;
        save(); renderSheetTabs(); renderTable();
      });
      bar.appendChild(add);
    }

    $('#exportSheetBtn').addEventListener('click', async () => {
      try {
        await loadScript('./vendor/xlsx.full.min.js');
        const aoa = [];
        for (let r = 1; r <= ROWS; r++) {
          const row = [];
          for (let c = 0; c < COLS; c++) row.push(evalCell(colLetter(c) + r));
          aoa.push(row);
        }
        const ws = window.XLSX.utils.aoa_to_sheet(aoa);
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, (sheets.active || 'Planilha1').slice(0, 31));
        const arrBuf = window.XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        await exportFile(slug(sheets.active) + '.xlsx', arrBuf);
      } catch (e) {
        if (!e || e.code !== 'declined') alert('Não foi possível gerar a planilha agora. Verifique a conexão e tente novamente.');
      }
    });

    renderSheetTabs(); renderTable(); selectCell('A1');
  }

    $('#slideBodyEdit').addEventListener('input', e => { activeSlide().body = e.target.value; save(); renderStrip(); });

    $('#addSlideBtn').addEventListener('click', () => {
      const s = { id: uid(), title: '', body: '', image: null };
      slides.push(s); active = s.id; save(); renderStrip(); renderCanvas();
      incrementUsage();
    });
    $('#delSlideBtn').addEventListener('click', () => {
      if (slides.length === 1) return;
      slides = slides.filter(s => s.id !== active);
      active = slides[0].id; save(); renderStrip(); renderCanvas();
    });

    $('#slideImageInput').addEventListener('change', async e => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      try {
        const dataUrl = await readImageDownscaled(file, 1000, 0.82);
        activeSlide().image = dataUrl; save(); renderStrip(); renderCanvas();
      } catch (err) { alert('Não foi possível importar essa imagem.'); }
    });
    $('#slideImageRemoveBtn').addEventListener('click', () => {
      activeSlide().image = null; save(); renderStrip(); renderCanvas();
    });

    let presentIdx = 0;
    function renderPresent() {
      const s = slides[presentIdx];
      $('#presentTitle').textContent = s.title || 'Sem título';
      $('#presentBody').textContent = s.body || '';
      $('#presentCounter').textContent = (presentIdx + 1) + ' / ' + slides.length;
      const wrap = $('#presentImageWrap');
      if (s.image) { $('#presentImageEl').src = s.image; wrap.hidden = false; } else { wrap.hidden = true; }
    }
    function openPresent() {
      presentIdx = Math.max(0, slides.findIndex(s => s.id === active));
      renderPresent();
      $('#presentOverlay').hidden = false;
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    }
    function closePresent() {
      $('#presentOverlay').hidden = true;
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    }
    $('#presentBtn').addEventListener('click', openPresent);
    $('#presentExit').addEventListener('click', closePresent);
    $('#presentPrev').addEventListener('click', () => { presentIdx = (presentIdx - 1 + slides.length) % slides.length; renderPresent(); });
    $('#presentNext').addEventListener('click', () => { presentIdx = (presentIdx + 1) % slides.length; renderPresent(); });
    document.addEventListener('keydown', e => {
      if ($('#presentOverlay').hidden) return;
      if (e.key === 'Escape') closePresent();
      else if (e.key === 'ArrowRight' || e.key === ' ') { presentIdx = (presentIdx + 1) % slides.length; renderPresent(); }
      else if (e.key === 'ArrowLeft') { presentIdx = (presentIdx - 1 + slides.length) % slides.length; renderPresent(); }
    });

    $('#exportSlidesBtn').addEventListener('click', async () => {
      try {
        await loadScript('./vendor/jszip.min.js');
        await loadScript('./vendor/pptxgen.min.js');
        const Ctor = window.PptxGenJS || window.pptxgen;
        const pres = new Ctor();
        slides.forEach(s => {
          const slide = pres.addSlide();
          const textW = s.image ? 5.2 : 9;
          slide.addText(s.title || 'Sem título', { x: 0.6, y: 0.6, w: textW, h: 1.1, fontFace: 'Georgia', fontSize: 28, bold: true, color: '0F6B5C' });
          slide.addText(s.body || '', { x: 0.6, y: 1.8, w: textW, h: 4.5, fontFace: 'Arial', fontSize: 16, color: '333333' });
          if (s.image) slide.addImage({ data: s.image, x: 6.2, y: 0.9, w: 3.2, h: 3.2, sizing: { type: 'contain', w: 3.2, h: 3.2 } });
        });
        let data;
        try { data = await pres.write({ outputType: 'arraybuffer' }); }
        catch (inner) { data = await pres.write('arraybuffer'); }
        await exportFile('apresentacao.pptx', data);
      } catch (e) {
        if (!e || e.code !== 'declined') alert('Não foi possível gerar a apresentação agora. Verifique a conexão e tente novamente.');
      }
    });

    renderStrip(); renderCanvas();
  }

  /* ============================================================
     Agenda
  ============================================================ */
  function initCalendar() {
    let events = LS.get('sa:events', {});
    let cursor = new Date(); cursor.setDate(1);
    const dowLabels = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
    const monthLabels = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

    function save() { LS.set('sa:events', events); }
    function keyFor(d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
    function titleOf(ev) { return typeof ev === 'string' ? ev : (ev.title || ''); }
    function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

    function render() {
      $('#monthLabel').textContent = monthLabels[cursor.getMonth()] + ' de ' + cursor.getFullYear();
      const grid = $('#calGrid');
      grid.innerHTML = '';
      dowLabels.forEach(label => { const el = document.createElement('div'); el.className = 'cal-dow'; el.textContent = label; grid.appendChild(el); });

      const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
      const startOffset = first.getDay();
      const daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
      const daysInPrev = new Date(cursor.getFullYear(), cursor.getMonth(), 0).getDate();
      const today = new Date();

      const cells = [];
      for (let i = startOffset - 1; i >= 0; i--) cells.push({ day: daysInPrev - i, muted: true, date: new Date(cursor.getFullYear(), cursor.getMonth() - 1, daysInPrev - i) });
      for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, muted: false, date: new Date(cursor.getFullYear(), cursor.getMonth(), d) });
      while (cells.length % 7 !== 0) {
        const n = cells.length - (startOffset + daysInMonth) + 1;
        cells.push({ day: n, muted: true, date: new Date(cursor.getFullYear(), cursor.getMonth() + 1, n) });
      }

      cells.forEach(c => {
        const el = document.createElement('div');
        el.className = 'cal-day' + (c.muted ? ' muted' : '') + (sameDay(c.date, today) ? ' today' : '');
        const k = keyFor(c.date);
        let html = '<div class="dnum">' + c.day + '</div>';
        (events[k] || []).forEach(ev => {
          const remind = typeof ev === 'object' && ev.remind;
          html += '<div class="cal-evt">' + (remind ? '\uD83D\uDD14 ' : '') + escapeHtml(titleOf(ev)) + '</div>';
        });
        el.innerHTML = html;
        el.addEventListener('click', e => openPopover(e, c.date, k));
        grid.appendChild(el);
      });
    }

    function removeEvent(k, index) {
      events[k].splice(index, 1);
      if (!events[k].length) delete events[k];
      save(); render();
      if (sameDay(new Date(k.split('-').map(Number)[0], k.split('-')[1] - 1, k.split('-')[2]), new Date())) checkTodayReminders();
    }

    function openPopover(e, date, k) {
      $$('.cal-popover').forEach(p => p.remove());
      const pop = document.createElement('div');
      pop.className = 'cal-popover';
      const rect = e.currentTarget.getBoundingClientRect();
      pop.style.top = Math.min(rect.top, window.innerHeight - 320) + 'px';
      pop.style.left = Math.min(rect.left, window.innerWidth - 272) + 'px';

      const titleEl = document.createElement('div');
      titleEl.className = 'cal-popover-title';
      titleEl.textContent = date.getDate() + ' de ' + monthLabels[date.getMonth()];
      pop.appendChild(titleEl);

      const existing = events[k] || [];
      if (existing.length) {
        const list = document.createElement('div');
        list.className = 'cal-existing';
        existing.forEach((ev, i) => {
          const row = document.createElement('div');
          row.className = 'cal-existing-item';
          const remind = typeof ev === 'object' && ev.remind;
          const note = typeof ev === 'object' ? ev.note : '';
          row.innerHTML = '<div class="txt"><div class="t">' + (remind ? '\uD83D\uDD14 ' : '') + escapeHtml(titleOf(ev)) + '</div>'
            + (note ? '<div class="n">' + escapeHtml(note) + '</div>' : '') + '</div>'
            + '<button title="Remover evento" aria-label="Remover evento"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>';
          row.querySelector('button').addEventListener('click', () => { removeEvent(k, i); pop.remove(); });
          list.appendChild(row);
        });
        pop.appendChild(list);
      }

      const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = 'Título do evento…';
      const note = document.createElement('textarea'); note.placeholder = 'Detalhes do lembrete (opcional)…'; note.rows = 2;
      const remindRow = document.createElement('label'); remindRow.className = 'remind-row';
      const chk = document.createElement('input'); chk.type = 'checkbox';
      remindRow.appendChild(chk); remindRow.appendChild(document.createTextNode(' Lembrar no dia'));
      const row = document.createElement('div'); row.className = 'row';
      const addBtn = document.createElement('button');
      addBtn.className = 'icon-btn filled sm'; addBtn.title = 'Adicionar evento'; addBtn.setAttribute('aria-label', 'Adicionar evento');
      addBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>';
      row.appendChild(addBtn);
      pop.appendChild(inp); pop.appendChild(note); pop.appendChild(remindRow); pop.appendChild(row);
      document.body.appendChild(pop);

      const addEvent = () => {
        if (!inp.value.trim()) return;
        events[k] = events[k] || [];
        events[k].push({ title: inp.value.trim(), note: note.value.trim(), remind: chk.checked });
        save(); render(); pop.remove(); incrementUsage();
        if (sameDay(date, new Date())) checkTodayReminders();
      };
      addBtn.addEventListener('click', addEvent);
      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') addEvent(); });
      setTimeout(() => inp.focus(), 10);
      setTimeout(() => {
        document.addEventListener('click', function outside(ev) {
          if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener('click', outside); }
        });
      }, 0);
    }

    function checkTodayReminders() {
      $('#reminderSlot').innerHTML = '';
      const todays = events[keyFor(new Date())] || [];
      const reminders = todays.filter(ev => typeof ev === 'object' && ev.remind);
      if (!reminders.length) return;
      const bar = document.createElement('div');
      bar.className = 'reminder-banner';
      const text = reminders.map(r => r.title + (r.note ? ' — ' + r.note : '')).join(' · ');
      bar.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>'
        + '<span></span><button class="icon-btn sm" aria-label="Fechar aviso"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>';
      bar.querySelector('span').textContent = 'Hoje: ' + text;
      bar.querySelector('button').addEventListener('click', () => bar.remove());
      $('#reminderSlot').appendChild(bar);

      if ('Notification' in window) {
        try {
          if (Notification.permission === 'granted') {
            reminders.forEach(r => new Notification('Lembrete — ' + r.title, { body: r.note || '' }));
          } else if (Notification.permission !== 'denied') {
            Notification.requestPermission().then(perm => {
              if (perm === 'granted') reminders.forEach(r => new Notification('Lembrete — ' + r.title, { body: r.note || '' }));
            }).catch(() => {});
          }
        } catch (e) {}
      }
    }

    $('#prevMonth').addEventListener('click', () => { cursor.setMonth(cursor.getMonth() - 1); render(); });
    $('#nextMonth').addEventListener('click', () => { cursor.setMonth(cursor.getMonth() + 1); render(); });
    $('#todayBtn').addEventListener('click', () => { cursor = new Date(); cursor.setDate(1); render(); });

    render();
    checkTodayReminders();
  }

  /* ============================================================
     Arquivos
  ============================================================ */
  function initFiles() {
    let files = LS.get('sa:files', []);
    function save() { LS.set('sa:files', files); }
    function isImage(f) { return (f.type || '').startsWith('image/') || !!f.data; }
    function fmtSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }
    function ext(name) { const parts = name.split('.'); return parts.length > 1 ? parts.pop().toUpperCase().slice(0, 4) : '—'; }

    let editingIndex = -1;
    let editingOriginal = null;
    let editState = { rotate: 0, flipH: false, grayscale: false };

    function openEditor(index) {
      editingIndex = index;
      editingOriginal = files[index].data;
      editState = { rotate: 0, flipH: false, grayscale: false };
      $('#imgEditorPreview').src = editingOriginal;
      $('#imgEditorOverlay').hidden = false;
    }
    async function refreshEditorPreview() {
      const out = await transformImage(editingOriginal, editState);
      $('#imgEditorPreview').src = out;
    }
    function closeEditor() { $('#imgEditorOverlay').hidden = true; editingIndex = -1; }

    $('#imgRotateBtn').addEventListener('click', async () => { editState.rotate = (editState.rotate + 90) % 360; await refreshEditorPreview(); });
    $('#imgFlipBtn').addEventListener('click', async () => { editState.flipH = !editState.flipH; await refreshEditorPreview(); });
    $('#imgGrayBtn').addEventListener('click', async () => {
      editState.grayscale = !editState.grayscale;
      $('#imgGrayBtn').classList.toggle('on', editState.grayscale);
      await refreshEditorPreview();
    });
    $('#imgResetBtn').addEventListener('click', async () => {
      editState = { rotate: 0, flipH: false, grayscale: false };
      $('#imgGrayBtn').classList.remove('on');
      $('#imgEditorPreview').src = editingOriginal;
    });
    $('#imgSaveBtn').addEventListener('click', async () => {
      if (editingIndex < 0) return;
      const out = await transformImage(editingOriginal, editState);
      files[editingIndex].data = out;
      save(); render(); closeEditor();
    });
    $('#imgEditorClose').addEventListener('click', closeEditor);

    function render() {
      const list = $('#filesList');
      if (!files.length) {
        list.innerHTML = '<div class="empty"><div class="icon">\u25C7</div><h3>Nenhum arquivo ainda</h3><p>Envie arquivos para deixá-los à mão neste espaço de trabalho.</p></div>';
        return;
      }
      list.innerHTML = '';
      files.forEach((f, i) => {
        const row = document.createElement('div');
        row.className = 'file-row';
        const iconInner = (isImage(f) && f.data) ? '<img src="' + f.data + '" alt="">' : ext(f.name);
        row.innerHTML = '<div class="ficon">' + iconInner + '</div><div class="fname"></div>'
          + '<div class="fmeta"><span>' + fmtSize(f.size || 0) + '</span><span>' + f.date + '</span></div>';
        row.querySelector('.fname').textContent = f.name;

        const meta = row.querySelector('.fmeta');
        if (isImage(f) && f.data) {
          const editBtn = document.createElement('button');
          editBtn.className = 'icon-btn sm'; editBtn.title = 'Editar imagem'; editBtn.setAttribute('aria-label', 'Editar imagem');
          editBtn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';
          editBtn.addEventListener('click', () => openEditor(i));
          meta.appendChild(editBtn);
        }
        const delBtn = document.createElement('button');
        delBtn.className = 'icon-btn sm danger'; delBtn.title = 'Remover'; delBtn.setAttribute('aria-label', 'Remover arquivo');
        delBtn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>';
        delBtn.addEventListener('click', () => { files.splice(i, 1); save(); render(); });
        meta.appendChild(delBtn);

        list.appendChild(row);
      });
    }

    $('#fileInput').addEventListener('change', async e => {
      const picked = Array.from(e.target.files);
      e.target.value = '';
      for (const file of picked) {
        const entry = { name: file.name, size: file.size, type: file.type, date: new Date().toLocaleDateString('pt-BR'), data: null };
        if (file.type && file.type.startsWith('image/') && file.size < 6 * 1024 * 1024) {
          try { entry.data = await readImageDownscaled(file, 1400, 0.85); } catch (err) {}
        }
        files.unshift(entry);
        incrementUsage();
      }
      save(); render();
    });

    render();
  }

  $('#search').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.value.trim()) {
      alert('Busca por "' + e.target.value.trim() + '" — resultados em Documentos, Planilhas e Arquivos apareceriam aqui em uma versão mais completa da busca.');
    }
  });

  /* ============================================================
     Boot
  ============================================================ */
  (async function boot() {
    await initBackend();
    initDocs(); initSheets(); initSlides(); initCalendar(); initFiles();
    const splash = $('#splash');
    setTimeout(() => {
      splash.classList.add('hidden');
      setTimeout(() => splash.remove(), 400);
    }, 1250);
  })();
})();
</script>
<script>
  window.showNativeSaveNotice = function (message) {
    const el = document.getElementById('nativeSaveToast');
    if (!el) return;
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(window.__saveToastTimer);
    window.__saveToastTimer = setTimeout(() => el.classList.remove('show'), 4200);
  };
</script>
